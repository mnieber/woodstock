services:
  woodstock-indexer:
    depends_on:
      localstack: {condition: service_healthy}
  woodstock-server:
    depends_on:
      localstack: {condition: service_healthy}
  localstack:
    container_name: woodstock_localstack
    image: "localstack/localstack:3.4.0"
    ports:
      - 4566:4566
    env_file:
      - env_files/localstack.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - "${ROOT_DIR}/localstack/scripts/initaws.d:/etc/localstack/init/ready.d"
