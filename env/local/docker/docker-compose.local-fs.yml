services:
  woodstock-indexer:
    command: woodstock run-indexer
    depends_on:
      localstack: null
    environment:
      WOODSTOCK_FILE_STORAGE_TYPE: local
      WOODSTOCK_LOCAL_STORAGE_DIR: /woodstock-data
      WOODSTOCK_DB_PATH: /woodstock-data/woodstock.db
      WOODSTOCK_POLL_INTERVAL_SECONDS: "5"
    volumes:
      - ${WOODSTOCK_LOCAL_FS_DIR}:/woodstock-data

  woodstock-server:
    command: woodstock run-server --host 0.0.0.0 --port 8000
    depends_on:
      localstack: null
    environment:
      WOODSTOCK_FILE_STORAGE_TYPE: local
      WOODSTOCK_LOCAL_STORAGE_DIR: /woodstock-data
      WOODSTOCK_DB_PATH: /woodstock-data/woodstock.db
    ports:
      - 8010:8000
    volumes:
      - ${WOODSTOCK_LOCAL_FS_DIR}:/woodstock-data

  woodstock-ui:
    build:
      context: ${ROOT_DIR}
      dockerfile: services/woodstock_ui/Dockerfile.local
    command: yarn dev --host
    environment:
      VITE_LOCALHOST_API_ENDPOINT: http://localhost:8010/
    ports:
      - 3003:3003
    image: woodstock_ui_local
